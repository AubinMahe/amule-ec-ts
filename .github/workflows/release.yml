name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Check tag, package.json and package-lock.json versions match
        run: npm run check-versions -- "$GITHUB_REF_NAME"
      - run: npm run pack-release
      - uses: softprops/action-gh-release@v2
        with:
          files: amule-ec-*.tgz
          generate_release_notes: true
